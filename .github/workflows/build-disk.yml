---
name: Build disk images

on:
  workflow_run:
    workflows: ["Build container image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - './disk_config/disk.toml'
      - './disk_config/iso.toml'
      - './.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Build disk images
    runs-on: ${{ inputs.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gnome
            image-name: techoos
            config-file: ./disk_config/iso.toml
            iso-name: TechoOS-GNOME.iso
          - variant: kde
            image-name: techoos-kde
            config-file: ./disk_config/iso-kde.toml
            iso-name: TechoOS-KDE.iso
    permissions:
      contents: write
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.config-file }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ matrix.image-name }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: anaconda-iso
          additional-args: --use-librepo=True --rootfs btrfs

      - name: Rename ISO to ${{ matrix.iso-name }}
        run: |
          sudo find "${{ steps.build.outputs.output-directory }}" -name "*.iso" | while read -r f; do
            sudo mv "$f" "$(dirname "$f")/${{ matrix.iso-name }}"
            echo "Renamed $f -> ${{ matrix.iso-name }}"
          done

      - name: Compress, split, and publish to GitHub Release
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          OUT="${{ steps.build.outputs.output-directory }}"
          ISO=$(sudo find "$OUT" -name "${{ matrix.iso-name }}" | head -1)
          base="${{ matrix.iso-name }}"            # e.g. TechoOS-GNOME.iso
          work=/tmp/release; mkdir -p "$work"

          echo "Compressing $base with zstd…"
          sudo zstd -T0 -15 "$ISO" -o "$work/${base}.zst"

          # Split into 1900MB parts to stay under the 2GB Release asset limit
          echo "Splitting into parts…"
          ( cd "$work" && split -b 1900M -d --additional-suffix=.part "${base}.zst" "${base}.zst." && rm -f "${base}.zst" )

          # Checksums: the raw ISO (for verification after rejoin) and each part
          echo "Hashing…"
          ISO_SHA=$(sudo sha256sum "$ISO" | awk '{print $1}')
          ( cd "$work" && sha256sum *.part > SHA256SUMS.${{ matrix.variant }}.txt )
          echo "${ISO_SHA}  ${base}" | sudo tee -a "$work/SHA256SUMS.${{ matrix.variant }}.txt"

          # A tiny rejoin helper so users can reassemble easily
          cat > "$work/REJOIN-${{ matrix.variant }}.txt" <<EOT
          TechoOS ${{ matrix.variant }} — reassemble the ISO:

          Linux/macOS:
            cat ${base}.zst.*.part > ${base}.zst
            zstd -d ${base}.zst -o ${base}
            sha256sum ${base}     # compare with SHA256SUMS

          Windows (PowerShell, needs 7-Zip or zstd):
            cmd /c copy /b "${base}.zst.00.part+${base}.zst.01.part+${base}.zst.02.part" ${base}.zst
            zstd -d ${base}.zst -o ${base}
            Get-FileHash ${base}
          EOT

          echo "Publishing release techoos-2.0.7…"
          gh release view techoos-2.0.7 --repo ${{ github.repository }} >/dev/null 2>&1 \
            || gh release create techoos-2.0.7 --repo ${{ github.repository }} \
                 --title "TechoOS 2.0.2 (Angkor)" \
                 --notes "Compressed, split ISO downloads served from GitHub's CDN. Download all parts for an edition plus its REJOIN and SHA256SUMS files, then reassemble." \
                 --latest
          gh release upload techoos-2.0.7 --repo ${{ github.repository }} --clobber "$work"/*

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: techoos-${{ matrix.variant }}-iso
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
      
      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}
