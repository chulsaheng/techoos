name: Diagnose anaconda branding
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
  issues: write
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect real Anaconda branding mechanism
        run: |
          # fedora-logos provides the installer branding; inspect it directly
          IMG=ghcr.io/chulsaheng/techoos:latest
          sudo podman pull "$IMG" 2>/dev/null
          run() { sudo podman run --rm "$IMG" bash -c "$1" 2>/dev/null; }
          {
            echo "=== fedora-logos: every anaconda file it owns ==="
            run "rpm -ql fedora-logos 2>/dev/null | grep -iE 'anaconda|sidebar|topbar' "
            echo "=== anaconda pixmaps dir contents ==="
            run "ls -la /usr/share/anaconda/pixmaps/ 2>/dev/null"
            echo "=== the anaconda CSS that styles the sidebar (grep for logo/sidebar rules) ==="
            run "for f in /usr/share/anaconda/pixmaps/*.css /usr/share/anaconda/*.css; do echo \"### \$f\"; grep -niE 'sidebar|logo|background-image' \"\$f\" 2>/dev/null; done"
            echo "=== the blue sidebar image: what file is it actually? ==="
            run "rpm -ql fedora-logos | grep -iE 'sidebar|anaconda.*(png|svg)'; echo '--- identify the blue one ---'; for f in /usr/share/anaconda/pixmaps/*.png; do echo \"\$f : \$(file -b \"\$f\" 2>/dev/null)\"; done"
            echo "=== anaconda product config (.buildstamp / product name) ==="
            run "cat /usr/share/anaconda/pixmaps/*.css 2>/dev/null | head -60"
          } > d.txt
          echo done
      - name: Post
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### Anaconda branding diagnostic'; echo '```'; cat d.txt; echo '```'; } > c.md
          gh issue comment 2 --repo ${{ github.repository }} --body-file c.md
