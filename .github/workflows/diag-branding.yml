name: Diagnose branding
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  issues: write

jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect the built image for branding + fastfetch
        run: |
          IMG=ghcr.io/chulsaheng/techoos:latest
          sudo podman pull "$IMG" 2>/dev/null
          run() { sudo podman run --rm "$IMG" bash -c "$1" 2>/dev/null; }
          {
            echo "=== os-release (NAME/ID/LOGO/VERSION) ==="
            run "grep -E '^(NAME|ID|ID_LIKE|LOGO|VERSION)=' /usr/lib/os-release /etc/os-release 2>/dev/null"
            echo
            echo "=== all fastfetch-related files ==="
            run "find / -iname '*fastfetch*' 2>/dev/null | grep -v proc"
            echo
            echo "=== who launches fastfetch on shell start ==="
            run "grep -rl fastfetch /etc/profile.d /etc/profile /usr/share/ublue-os /usr/share/bazzite /etc/skel 2>/dev/null"
            echo "--- contents of those launchers ---"
            run "for f in \$(grep -rl fastfetch /etc/profile.d /usr/share/ublue-os 2>/dev/null); do echo \"### \$f\"; cat \"\$f\"; echo; done"
            echo
            echo "=== our techoos fastfetch config (does it exist?) ==="
            run "cat /etc/fastfetch/config.jsonc 2>/dev/null | head -20"
            echo
            echo "=== logo / pixmap files mentioning bazzite/fedora/logo ==="
            run "find /usr/share/pixmaps /usr/share/icons /usr/share/plymouth -iname '*bazzite*' -o -iname '*fedora*logo*' -o -iname 'system-logo*' 2>/dev/null | head -40"
            echo
            echo "=== our techoos files ==="
            run "ls -la /usr/share/techoos/ 2>/dev/null; echo '---app log---'; cat /usr/share/techoos/app-install.log 2>/dev/null"
          } > diag.txt
          echo "collected $(wc -l < diag.txt) lines"

      - name: Post results to issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '### Branding diagnostic'; echo '```'; cat diag.txt; echo '```'; } > c.md
          gh issue comment 2 --repo ${{ github.repository }} --body-file c.md
